<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для клиентов - DI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c5530;
            --primary-light: #6c9c84;
            --secondary-color: #d4a574;
            --text-dark: #1a1a1a;
            --text-light: #666;
            --bg-light: #fafafa;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --shadow-hover: 0 20px 60px rgba(0,0,0,0.15);
            --gradient: linear-gradient(135deg, #2c5530 0%, #6c9c84 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background: var(--bg-light);
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
        }

        /* Навигация */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--primary-light);
        }

        /* Контейнер входа */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 50px;
        }

        .login-box {
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-hover);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }

        .login-header {
            background: var(--gradient);
            color: white;
            padding: 2.5rem;
            text-align: center;
        }

        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            opacity: 0.9;
        }

        .login-form {
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e5e5;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .alert-info {
            background: #eef;
            color: #33c;
            border: 1px solid #ccf;
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e5e5;
            color: var(--text-light);
        }

        .password-toggle {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 5px;
        }

        .toggle-password:hover {
            color: var(--primary-light);
        }

        /* Loader */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading .spinner {
            display: block;
        }

        .loading .btn-text {
            display: none;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-form {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">DI</a>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                На главную
            </a>
        </div>
    </nav>

    <!-- Контейнер входа -->
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-user-circle" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                <h1 id="formTitle">Вход для клиентов</h1>
                <p id="formSubtitle">Введите ваш номер телефона для входа</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="alert alert-error" id="errorAlert"></div>
                <div class="alert alert-success" id="successAlert"></div>
                <div class="alert alert-info" id="infoAlert"></div>

                <!-- Этап 1: Ввод телефона -->
                <div id="phoneStep">
                    <div class="form-group">
                        <label class="form-label" for="phoneInput">
                            <i class="fas fa-phone"></i> Номер телефона
                        </label>
                        <div class="password-toggle">
                            <input 
                                type="tel" 
                                id="phoneInput" 
                                class="form-control" 
                                placeholder="+7 (999) 123-45-67"
                                required
                            >
                            <button type="button" class="toggle-password" onclick="clearPhone()" id="clearPhoneBtn" style="display: none;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="checkPhoneBtn">
                        <span class="btn-text">Продолжить</span>
                        <div class="spinner"></div>
                    </button>
                </div>

                <!-- Этап 2: Создание пароля (первый вход) -->
                <div id="createPasswordStep" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="newPassword">
                            <i class="fas fa-lock"></i> Создайте пароль
                        </label>
                        <div class="password-toggle">
                            <input 
                                type="password" 
                                id="newPassword" 
                                class="form-control" 
                                placeholder="Минимум 6 символов"
                                minlength="6"
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">
                            <i class="fas fa-lock"></i> Подтвердите пароль
                        </label>
                        <div class="password-toggle">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                class="form-control" 
                                placeholder="Повторите пароль"
                                minlength="6"
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="button" class="btn btn-primary" id="createPasswordBtn">
                        <span class="btn-text">Создать пароль и войти</span>
                        <div class="spinner"></div>
                    </button>

                    <button type="button" class="btn" style="margin-top: 10px; background: #e5e5e5;" onclick="backToPhone()">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                </div>

                <!-- Этап 3: Вход с паролем -->
                <div id="loginStep" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="password">
                            <i class="fas fa-lock"></i> Введите пароль
                        </label>
                        <div class="password-toggle">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-control" 
                                placeholder="Ваш пароль"
                            >
                            <button type="button" class="toggle-password" onclick="togglePassword('password')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="button" class="btn btn-primary" id="loginBtn">
                        <span class="btn-text">Войти</span>
                        <div class="spinner"></div>
                    </button>

                    <button type="button" class="btn" style="margin-top: 10px; background: #e5e5e5;" onclick="backToPhone()">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                </div>
            </form>

            <div class="form-footer">
                <p><i class="fas fa-info-circle"></i> Если у вас возникли проблемы со входом, свяжитесь с нами по телефону или email</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Конфигурация Firebase -->
    <script src="js/firebase-config.js"></script>

    <!-- Логика авторизации -->
    <script src="js/auth.js"></script>

    <script>
        // Маска для телефона
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('phoneInput');
            const clearPhoneBtn = document.getElementById('clearPhoneBtn');
            
            if (phoneInput) {
                phoneInput.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    
                    if (value.length > 0 && value[0] !== '7') {
                        value = '7' + value;
                    }
                    
                    let formattedValue = '';
                    if (value.length > 0) {
                        formattedValue = '+7';
                        if (value.length > 1) {
                            formattedValue += ' (' + value.substring(1, 4);
                        }
                        if (value.length >= 4) {
                            formattedValue += ') ' + value.substring(4, 7);
                        }
                        if (value.length >= 7) {
                            formattedValue += '-' + value.substring(7, 9);
                        }
                        if (value.length >= 9) {
                            formattedValue += '-' + value.substring(9, 11);
                        }
                    }
                    
                    e.target.value = formattedValue;
                    
                    // Показываем/скрываем кнопку очистки
                    if (clearPhoneBtn) {
                        clearPhoneBtn.style.display = formattedValue.length > 0 ? 'block' : 'none';
                    }
                });
            }
        });
        
        // Функция очистки поля телефона
        function clearPhone() {
            const phoneInput = document.getElementById('phoneInput');
            const clearPhoneBtn = document.getElementById('clearPhoneBtn');
            
            if (phoneInput) {
                phoneInput.value = '';
                phoneInput.focus();
            }
            
            if (clearPhoneBtn) {
                clearPhoneBtn.style.display = 'none';
            }
        }
    </script>
</body>
</html>
